<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Index PRO+ | Showcase</title>

<style>
body{
  font-family: system-ui;
  background:#f5f6f8;
  margin:0;
  padding:20px;
}
h1{margin-bottom:10px}
input{
  width:100%;
  padding:12px;
  font-size:16px;
}
button{
  margin-top:10px;
  padding:12px 16px;
  font-size:16px;
  cursor:pointer;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:16px;
  margin-top:20px;
}
.card{
  background:#fff;
  border-radius:12px;
  padding:10px;
  box-shadow:0 4px 10px rgba(0,0,0,.05);
}
.card img{
  width:100%;
  border-radius:8px;
}
.name{
  font-size:14px;
  margin:8px 0;
}
.price{
  color:#e60023;
  font-weight:bold;
}
.actions{
  display:flex;
  gap:6px;
  margin-top:8px;
}
.actions a{
  flex:1;
  text-align:center;
  padding:8px;
  font-size:13px;
  border-radius:6px;
  text-decoration:none;
  background:#eee;
  color:#000;
}
</style>
</head>

<body>

<h1>🛍️ TikTok Showcase Viewer</h1>
<input id="urlInput" placeholder="วาง URL โชว์เคส TikTok ที่นี่" />
<button onclick="loadProducts()">แสดงสินค้า</button>

<div id="result" class="grid"></div>

<script>
const FIREBASE =
  "https://index-pro-tiktok-default-rtdb.asia-southeast1.firebasedatabase.app/imports.json";

async function loadProducts(){
  const url = document.getElementById("urlInput").value.trim();
  if(!url){
    alert("กรุณาวาง URL");
    return;
  }

  const res = await fetch(FIREBASE);
  const data = await res.json();

  const allItems = [];
  Object.values(data || {}).forEach(batch=>{
    if(batch.items){
      batch.items.forEach(it=>{
        if(it.url && it.url.includes("tiktok")){
          allItems.push(it);
        }
      });
    }
  });

  render(allItems);
}

function render(items){
  const box = document.getElementById("result");
  box.innerHTML = "";

  if(!items.length){
    box.innerHTML = "<p>ไม่พบสินค้าในฐานข้อมูล</p>";
    return;
  }

  items.forEach(it=>{
    const div = document.createElement("div");
    div.className="card";
    div.innerHTML=`
      <img src="${it.image || ''}">
      <div class="name">${it.name || '-'}</div>
      <div class="price">฿${it.price || '-'}</div>
      <div class="actions">
        <a href="${it.image}" download>⬇️ รูป</a>
        <a href="${it.url}" target="_blank">🔗 สินค้า</a>
      </div>
    `;
    box.appendChild(div);
  });
}
</script>

</body>
</html>
