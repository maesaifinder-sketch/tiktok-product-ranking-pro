<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Index PRO+ – TikTok Feed Intelligence</title>

<style>
body{margin:0;font-family:system-ui;background:#f1f5f9}
header{background:#020617;color:#fff;padding:20px}
.container{max-width:1500px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.stat{font-size:30px;font-weight:900}
.badge{padding:4px 10px;border-radius:20px;font-size:12px;background:#e5e7eb}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid #eee}
th{background:#f8fafc}
.foi{font-size:22px;font-weight:900}

button,input,select,textarea{
  padding:10px;border-radius:10px;border:1px solid #cbd5f5;font-family:inherit
}
button{background:#020617;color:#fff;cursor:pointer}
button.secondary{background:#475569}
button.danger{background:#dc2626}
textarea{width:100%;min-height:160px}
small{color:#64748b}
hr{border:none;border-top:1px solid #e5e7eb;margin:12px 0}

.thumb{
  width:48px;height:48px;object-fit:cover;border-radius:8px;border:1px solid #e5e7eb;
  cursor:pointer;transition:.15s;
}
.thumb:hover{transform:scale(2);z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.2);}

.dl-btn{
  margin-top:6px;width:100%;padding:6px 10px;font-size:12px;font-weight:700;
  border-radius:10px;border:1px solid #cbd5f5;background:#fff;color:#020617;cursor:pointer;
}
.dl-btn:hover{background:#f8fafc}

.pagination{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.page-btn{min-width:36px;padding:6px 10px;border-radius:8px;border:1px solid #cbd5f5;background:#fff;cursor:pointer;font-weight:600;color:#020617}
.page-btn.active{background:#020617;color:#fff}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
.page-info{font-size:14px;color:#64748b}
.product-btn{display:inline-block;padding:4px 10px;font-size:12px;font-weight:600;border-radius:999px;background:#ecfeff;color:#0369a1;border:1px solid #67e8f9;text-decoration:none}
.product-btn:hover{background:#cffafe}
</style>
</head>

<body>
<header>
  <h1>🚀 Index PRO+ – Feed Opportunity Index</h1>
  <small>Kalodata-style | Affiliate Intelligence | No API</small>
</header>

<div class="container">
  <div class="card">
    <input id="search" placeholder="ค้นหาสินค้า">
    <button onclick="apply()">Filter</button>
  </div>

  <br>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>รูป</th>
          <th>Name</th>
          <th>ID</th>
          <th>Product Link</th>
        </tr>
      </thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
</div>

<script>
const DB_ROOT="https://index-pro-tiktok-default-rtdb.asia-southeast1.firebasedatabase.app";
const IMPORT_PATH="/imports.json";
let DATA=[]; let FILTERED_DATA=[];

function to800(url){
  if(!url) return "";
  const up = url.replace(/(resize-[a-z]+):\\d+:\\d+\\.(jpeg|jpg|png|webp)/i, "$1:800:800.$2");
  return up === url ? url : up;
}

async function downloadImage(url, filename){
  if(!url){ alert("❌ ไม่พบลิงก์รูป"); return; }
  const safeName = (filename || "image").replace(/[\\/:*?"<>|]+/g,"_");
  try{
    const r = await fetch(url, { mode: "cors" });
    if(!r.ok) throw new Error("HTTP " + r.status);
    const blob = await r.blob();
    const a = document.createElement("a");
    const obj = URL.createObjectURL(blob);
    a.href = obj; a.download = safeName;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(obj);
  }catch(e){
    window.open(url, "_blank", "noopener,noreferrer");
    alert("ℹ️ ถ้าโหลดตรง ๆ ไม่ได้ ระบบจะเปิดรูป 800x800 ในแท็บใหม่ให้เซฟเอง");
  }
}

function buildProductLink(p){
  if(!p) return "";
  const pid = (p.product_id || "").toString().replace(/[^\\d]/g,"");
  return pid ? `https://shop.tiktok.com/view/product/${pid}?region=TH&locale=th-TH&source=agency` : "";
}

async function load(){
  const r = await fetch(DB_ROOT + IMPORT_PATH);
  const j = await r.json();
  if(!j) return;
  DATA=[];
  Object.values(j).forEach(b=>{
    (b.items||[]).forEach(p=>{
      p.product_id = (p.product_id || p.productId || "").toString().replace(/[^\\d]/g,"");
      p.name = p.name || "-";
      DATA.push(p);
    });
  });
  FILTERED_DATA=[...DATA];
  render();
}

function render(){
  tb.innerHTML="";
  FILTERED_DATA.forEach((p,i)=>{
    const productLink = buildProductLink(p);
    tb.innerHTML += `
<tr>
  <td>#${i+1}</td>
  <td>
    <img class="thumb" src="${p.image || 'https://via.placeholder.com/80'}">
    <button class="dl-btn" onclick='downloadImage(to800(${JSON.stringify(p.image || "")}), "${(p.product_id || "product")}_800.jpg")'>
      ⬇️ Download 800x800
    </button>
  </td>
  <td><b>${p.name}</b></td>
  <td><code>${p.product_id || "-"}</code></td>
  <td>${productLink ? `<a href="${productLink}" target="_blank" class="product-btn">🔗 เปิดสินค้า</a>` : "-"}</td>
</tr>`;
  });
}

function apply(){
  const q = search.value.toLowerCase();
  FILTERED_DATA = DATA.filter(p => !q || p.name.toLowerCase().includes(q));
  render();
}

load();
</script>
</body>
</html>
