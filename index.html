<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Index PRO+ – TikTok Feed Intelligence</title>

<style>
body{margin:0;font-family:system-ui;background:#f1f5f9}
header{background:#020617;color:#fff;padding:20px}
.container{max-width:1500px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.stat{font-size:30px;font-weight:900}
.badge{padding:4px 10px;border-radius:20px;font-size:12px;background:#e5e7eb}
.badge.warn{background:#fde68a}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid #eee}
th{background:#f8fafc}
.foi{font-size:22px;font-weight:900}
tr.unmatched{background:#fffbeb}

button,input,select,textarea{
  padding:10px;
  border-radius:10px;
  border:1px solid #cbd5f5;
  font-family:inherit
}
button{background:#020617;color:#fff;cursor:pointer}
button.secondary{background:#475569}
button.danger{background:#dc2626}
textarea{width:100%;min-height:140px}
small{color:#64748b}
hr{border:none;border-top:1px solid #e5e7eb;margin:12px 0}

/* CATEGORY */
.cat-scroll{max-height:260px;overflow-y:auto;padding-right:6px}
.cat-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
  cursor:grab;
}
.cat-item:hover{background:#f8fafc}
.cat-left{cursor:pointer}
.cat-count{margin-left:6px;font-size:12px;color:#475569}

/* Pagination */
.pagination{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.page-btn{
  min-width:36px;padding:6px 10px;border-radius:8px;
  border:1px solid #cbd5f5;background:#fff;color:#020617;
  cursor:pointer;font-weight:600
}
.page-btn.active{background:#020617;color:#fff}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>

<body>

<header>
  <h1>🚀 Index PRO+ – Feed Opportunity Index</h1>
  <small>Kalodata-style | Affiliate Intelligence | No API</small>
</header>

<div class="container">

<div class="grid">
  <div class="card"><h3>📦 สินค้าทั้งหมด</h3><div class="stat" id="total">0</div></div>
  <div class="card"><h3>🚀 FOI ≥ 75</h3><div class="stat" id="easy">0</div></div>
  <div class="card"><h3>💰 ROI สูง</h3><div class="stat" id="roiHigh">0</div></div>
  <div class="card"><h3>🔥 หมวดมาแรง</h3><div class="stat" id="topCat">-</div></div>
</div>

<br>

<div class="card">
  <input id="search" placeholder="ค้นหาสินค้า">
  <select id="catFilter"></select>
  <button onclick="apply()">Filter</button>
</div>

<br>

<!-- TOGGLE CATEGORY -->
<div class="card">
  <button class="secondary" onclick="toggleCategory()" id="toggleBtn">➕ แสดงการจัดการหมวดหมู่</button>
</div>

<br>

<!-- CATEGORY MANAGER (HIDDEN DEFAULT) -->
<div class="card" id="categoryBox" style="display:none">
  <h3>🗂 จัดการหมวดหมู่ (ลากเพื่อจัดลำดับ)</h3>
  <input id="catName" placeholder="ชื่อหมวด">
  <input id="catRegex" placeholder="Keyword / Regex">
  <button onclick="addCategory()">➕ เพิ่มหมวด</button>
  <small id="regexPreview"></small>
  <hr>
  <div id="catList" class="cat-scroll"></div>
</div>

<br>

<div class="card">
<table>
<thead>
<tr>
<th>#</th><th>สินค้า</th><th>หมวด</th>
<th>FOI</th><th>ROI</th><th>Sell</th><th>Feed</th><th>สถานะ</th>
</tr>
</thead>
<tbody id="tb"></tbody>
</table>

<div style="margin-top:12px">
  <div class="pagination" id="pagination"></div>
</div>
</div>

</div>

<script>
const DB_ROOT="https://index-pro-tiktok-default-rtdb.asia-southeast1.firebasedatabase.app";
const IMPORT_PATH="/imports.json";
const CAT_KEY="INDEX_PRO_CATEGORIES";

let DATA=[],FILTERED_DATA=[];
let CURRENT_PAGE=1,PAGE_SIZE=20;
let drag=null;

let CATEGORIES=JSON.parse(localStorage.getItem(CAT_KEY))||[
  {name:"Topper",regex:"topper|ท็อปเปอร์"},
  {name:"ผ้าปูที่นอน",regex:"ผ้าปู"},
  {name:"หมอน",regex:"หมอน"},
  {name:"ผ้าห่ม",regex:"ผ้าห่ม"},
];

const sellScore=p=>Math.round((p.avgViews||0)/1000);
const feedScore=p=>Math.round((p.engagement||0)*30);
const FOI=p=>Math.min(100,Math.round(sellScore(p)*0.4+feedScore(p)*0.6));
const roiScore=p=>Math.round(p.foi*0.7);

/* TOGGLE CATEGORY */
function toggleCategory(){
  const box=document.getElementById("categoryBox");
  const btn=document.getElementById("toggleBtn");
  if(box.style.display==="none"){
    box.style.display="block";
    btn.innerText="➖ ซ่อนการจัดการหมวดหมู่";
  }else{
    box.style.display="none";
    btn.innerText="➕ แสดงการจัดการหมวดหมู่";
  }
}

function recalcCategory(){
  DATA.forEach(p=>{
    p.category=CATEGORIES.find(c=>new RegExp(c.regex,"i").test(p.name))?.name||"อื่นๆ";
  });
}

async function load(){
  const r=await fetch(DB_ROOT+IMPORT_PATH);
  const j=await r.json(); if(!j)return;
  DATA=[];
  Object.values(j).forEach(b=>{
    (b.items||[]).forEach(p=>{
      p.shop=p.shop||"-";
      p.sell=sellScore(p);p.feed=feedScore(p);
      p.foi=FOI(p);p.roi=roiScore(p);
      DATA.push(p);
    });
  });
  recalcCategory();
  reload();
}

function reload(){
  dashboard();
  FILTERED_DATA=[...DATA];
  CURRENT_PAGE=1;
  renderCatManager();
  renderPage();
}

function dashboard(){
  total.innerText=DATA.length;
  easy.innerText=DATA.filter(p=>p.foi>=75).length;
  roiHigh.innerText=DATA.filter(p=>p.roi>=70).length;
  const c={};DATA.forEach(p=>c[p.category]=(c[p.category]||0)+1);
  topCat.innerText=Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||"-";
}

function apply(cat){
  const q=search.value?.toLowerCase()||"";
  FILTERED_DATA=DATA.filter(p=>
    (!q||p.name.toLowerCase().includes(q)) &&
    (!cat||p.category===cat)
  );
  CURRENT_PAGE=1;
  renderPage();
}

function renderPage(){
  const start=(CURRENT_PAGE-1)*PAGE_SIZE;
  tb.innerHTML="";
  FILTERED_DATA.slice(start,start+PAGE_SIZE)
    .sort((a,b)=>b.foi-a.foi)
    .forEach((p,i)=>{
      tb.innerHTML+=`
<tr class="${p.category==='อื่นๆ'?'unmatched':''}">
<td>#${start+i+1}</td>
<td>${p.name}<br><small>${p.shop}</small></td>
<td><span class="badge ${p.category==='อื่นๆ'?'warn':''}">${p.category}</span></td>
<td class="foi">${p.foi}</td>
<td>${p.roi}</td>
<td>${p.sell}</td>
<td>${p.feed}</td>
<td>${p.roi>=70?"💰":"⚠️"}</td>
</tr>`;
    });
}

function renderCatManager(){
  catList.innerHTML="";
  CATEGORIES.forEach((c,i)=>{
    const count=DATA.filter(p=>p.category===c.name).length;
    catList.innerHTML+=`
<div class="cat-item" draggable="true"
 ondragstart="drag=${i}"
 ondragover="event.preventDefault()"
 ondrop="moveCat(${i})">
  <div class="cat-left" onclick="apply('${c.name}')">
    <b>${c.name}</b>
    <span class="cat-count">(${count})</span><br>
    <small>${c.regex}</small>
  </div>
  <button class="danger" onclick="confirmRemove(${i})">ลบ</button>
</div>`;
  });
}

function confirmRemove(i){
  if(confirm(`ต้องการลบหมวด "${CATEGORIES[i].name}" ใช่หรือไม่?`)){
    CATEGORIES.splice(i,1);
    saveCat();
  }
}

function addCategory(){
  if(!catName.value||!catRegex.value)return;
  CATEGORIES.unshift({name:catName.value,regex:catRegex.value});
  saveCat();
  catName.value=catRegex.value="";
}

function moveCat(to){
  const item=CATEGORIES.splice(drag,1)[0];
  CATEGORIES.splice(to,0,item);
  saveCat();
}

function saveCat(){
  localStorage.setItem(CAT_KEY,JSON.stringify(CATEGORIES));
  recalcCategory();
  reload();
}

catRegex.oninput=()=>{
  try{
    const r=new RegExp(catRegex.value,"i");
    const m=DATA.filter(p=>r.test(p.name)).length;
    regexPreview.innerText=`จับได้ ${m} สินค้า`;
  }catch{
    regexPreview.innerText="Regex ไม่ถูกต้อง";
  }
};

load();
</script>

</body>
</html>
