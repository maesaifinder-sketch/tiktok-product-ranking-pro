<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Index PRO+ – TikTok Feed Intelligence</title>

<style>
body{margin:0;font-family:system-ui;background:#f1f5f9}
header{background:#020617;color:#fff;padding:20px}
.container{max-width:1500px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.stat{font-size:30px;font-weight:900}
.badge{padding:4px 10px;border-radius:20px;font-size:12px;background:#e5e7eb}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid #eee}
th{background:#f8fafc}
.foi{font-size:22px;font-weight:900}

button,input,select,textarea{
  padding:10px;border-radius:10px;border:1px solid #cbd5f5;font-family:inherit
}
button{background:#020617;color:#fff;cursor:pointer}
button.secondary{background:#475569}
button.danger{background:#dc2626}
button.ghost{background:#e5e7eb;color:#020617}
textarea{width:100%;min-height:160px}
small{color:#64748b}
hr{border:none;border-top:1px solid #e5e7eb;margin:12px 0}

.cat-scroll{max-height:260px;overflow-y:auto}
.cat-item{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cat-actions button{margin-left:6px}

.pagination{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.page-btn{min-width:36px;padding:6px 10px;border-radius:8px;border:1px solid #cbd5f5;background:#fff;cursor:pointer}
.page-btn.active{background:#020617;color:#fff}
</style>
</head>

<body>

<header>
  <h1>🚀 Index PRO+ – Feed Opportunity Index</h1>
  <small>Kalodata-style | Affiliate Intelligence | No API</small>
</header>

<div class="container">

<!-- DASHBOARD -->
<div class="grid">
  <div class="card"><h3>📦 สินค้าทั้งหมด</h3><div class="stat" id="total">0</div></div>
  <div class="card"><h3>🚀 FOI ≥ 75</h3><div class="stat" id="easy">0</div></div>
  <div class="card"><h3>💰 ROI สูง</h3><div class="stat" id="roiHigh">0</div></div>
  <div class="card"><h3>🔥 หมวดมาแรง</h3><div class="stat" id="topCat">-</div></div>
</div>

<br>

<!-- FILTER -->
<div class="card">
  <input id="search" placeholder="ค้นหาสินค้า">
  <select id="catFilter"></select>
  <button onclick="apply()">Filter</button>
</div>

<br>

<!-- CATEGORY -->
<div class="card">
  <h3>🗂 จัดการหมวดหมู่</h3>
  <input id="catName" placeholder="ชื่อหมวด">
  <input id="catRegex" placeholder="Keyword / Regex">
  <button onclick="addCategory()">➕ เพิ่มหมวด</button>
  <button class="danger" onclick="clearProductsAndCategories()">
  🧹 ลบสินค้า & หมวดหมู่
</button>
  <hr>
  <div id="catList" class="cat-scroll"></div>
</div>

<br>

<!-- TABLE -->
<div class="card">
<table>
<thead>
<tr>
<th></th>
<th>#</th><th>สินค้า</th><th>หมวด</th>
<th>FOI</th><th>ROI</th><th>Sell</th><th>Feed</th>
</tr>
</thead>
<tbody id="tb"></tbody>
</table>
</div>

<br>

<!-- GPT -->
<div class="card">
  <h3>🧠 Send to GPT</h3>
  <textarea id="gptPrompt"></textarea>
  <button onclick="sendToGPT()">📤 Copy & Open ChatGPT</button>
</div>

</div>

<script>
async function clearProductsAndCategories(){
  if(!confirm("ต้องการลบสินค้าใน Firebase และล้างหมวดหมู่ทั้งหมดใช่ไหม?")) return;

  try{
    // 1️⃣ ลบสินค้าใน Firebase (/imports)
    const url = DB_ROOT + "/imports.json";
    const res = await fetch(url,{ method:"DELETE" });

    if(!res.ok) throw new Error("Firebase delete failed");

    // 2️⃣ ลบหมวดหมู่ (localStorage)
    localStorage.removeItem(CAT_KEY);
    CATEGORIES = [...DEFAULT_CATS];

    // 3️⃣ Reset data ในระบบ
    DATA = [];
    FILTERED_DATA = [];
    CURRENT_PAGE = 1;

    // 4️⃣ รีเฟรช UI
    renderCatManager();
    filterCat();
    dashboard();
    buildGPT();
    renderPage();

    alert("ลบสินค้าและรีเซ็ตหมวดหมู่เรียบร้อยแล้ว ✅");

  }catch(e){
    console.error(e);
    alert("เกิดข้อผิดพลาดในการลบข้อมูล ❌");
  }
}

let DATA=[],FILTERED_DATA=[],SELECTED=new Set();

/* ===== CATEGORY ===== */
const CAT_KEY="INDEX_PRO_CATEGORIES";
let CATEGORIES=JSON.parse(localStorage.getItem(CAT_KEY))||[
  {name:"Topper",regex:"topper",visible:true},
  {name:"หมอน",regex:"หมอน|pillow",visible:true}
];

function saveCat(){
  localStorage.setItem(CAT_KEY,JSON.stringify(CATEGORIES));
  reload();
}

function addCategory(){
  if(!catName.value||!catRegex.value)return;
  CATEGORIES.unshift({name:catName.value,regex:catRegex.value,visible:true});
  catName.value=catRegex.value="";
  saveCat();
}

function toggleCat(i){
  CATEGORIES[i].visible=!CATEGORIES[i].visible;
  saveCat();
}

function removeCategory(i){
  if(!confirm(`ลบหมวด "${CATEGORIES[i].name}" ?`))return; // ⭐ confirm
  CATEGORIES.splice(i,1);
  saveCat();
}

function renderCatManager(){
  catList.innerHTML="";
  CATEGORIES.forEach((c,i)=>{
    catList.innerHTML+=`
    <div class="cat-item">
      <div>
        <b>${c.name}</b>
        <small> (${c.regex})</small>
      </div>
      <div class="cat-actions">
        <button class="ghost" onclick="toggleCat(${i})">
          ${c.visible?"👁":"🚫"}
        </button>
        <button class="danger" onclick="removeCategory(${i})">ลบ</button>
      </div>
    </div>`;
  });
}

/* ===== SCORE ===== */
const sell=p=>Math.round((p.avgViews||0)/1000);
const feed=p=>Math.round((p.engagement||0)*30);
const foi=p=>Math.min(100,Math.round(sell(p)*0.4+feed(p)*0.6));
const roi=p=>Math.round(foi(p)*0.7);

/* ===== LOAD ===== */
function load(){
  DATA=[
    {name:"Topper รุ่น A",shop:"Shop A",avgViews:50000,engagement:2},
    {name:"หมอนสุขภาพ",shop:"Shop B",avgViews:12000,engagement:1.2}
  ];
  reload();
}

function reload(){
  renderCatManager();

  DATA.forEach(p=>{
    const cat=CATEGORIES.find(c=>c.visible&&new RegExp(c.regex,"i").test(p.name));
    p.category=cat?cat.name:"อื่นๆ";
    p.sell=sell(p);p.feed=feed(p);p.foi=foi(p);p.roi=roi(p);
  });

  FILTERED_DATA=DATA.filter(p=>p.category!=="อื่นๆ"||CATEGORIES.some(c=>!c.visible));
  renderTable();
  renderFilter();
  dashboard();
  buildGPT();
}

function renderFilter(){
  catFilter.innerHTML='<option value="">ทุกหมวด</option>';
  CATEGORIES.filter(c=>c.visible)
    .forEach(c=>catFilter.innerHTML+=`<option>${c.name}</option>`);
}

function apply(){
  const q=search.value.toLowerCase();
  const c=catFilter.value;
  FILTERED_DATA=DATA.filter(p=>
    (!q||p.name.toLowerCase().includes(q)) &&
    (!c||p.category===c)
  );
  renderTable();
  dashboard();
  buildGPT();
}

function renderTable(){
  tb.innerHTML="";
  FILTERED_DATA.sort((a,b)=>b.foi-a.foi).forEach((p,i)=>{
    tb.innerHTML+=`
<tr>
<td><input type="checkbox" onchange="toggleSelect('${i}')" ${SELECTED.has(i)?"checked":""}></td>
<td>#${i+1}</td>
<td>${p.name}<br><small>${p.shop}</small></td>
<td><span class="badge">${p.category}</span></td>
<td class="foi">${p.foi}</td>
<td>${p.roi}</td>
<td>${p.sell}</td>
<td>${p.feed}</td>
</tr>`;
  });
}

function toggleSelect(i){
  SELECTED.has(i)?SELECTED.delete(i):SELECTED.add(i);
  buildGPT();
}

function dashboard(){
  total.innerText=FILTERED_DATA.length;
  easy.innerText=FILTERED_DATA.filter(p=>p.foi>=75).length;
  roiHigh.innerText=FILTERED_DATA.filter(p=>p.roi>=70).length;
  const c={};
  FILTERED_DATA.forEach(p=>c[p.category]=(c[p.category]||0)+1);
  topCat.innerText=Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||"-";
}

/* ===== GPT ===== */
function buildGPT(){
  const list=SELECTED.size
    ? [...SELECTED].map(i=>FILTERED_DATA[i])
    : FILTERED_DATA.slice(0,10);

  gptPrompt.value=list.map((p,i)=>
    `${i+1}. ${p.name} | ร้าน:${p.shop} | FOI:${p.foi}`
  ).join("\n");
}

function sendToGPT(){
  navigator.clipboard.writeText(gptPrompt.value);
  window.open("https://chat.openai.com");
}

load();
</script>

</body>
</html>
