<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Index PRO+ – TikTok Feed Intelligence (SaaS)</title>

<!-- Firebase SDK (Compat = ใช้ง่าย ไฟล์เดียว) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:system-ui;background:#f1f5f9}
header{background:#020617;color:#fff;padding:20px}
.container{max-width:1500px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.stat{font-size:30px;font-weight:900}
.badge{padding:4px 10px;border-radius:20px;font-size:12px;background:#e5e7eb}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid #eee;vertical-align:top}
th{background:#f8fafc}
.rank{font-weight:900}
.foi{font-size:22px;font-weight:900;color:#0f172a}
button,input,select,textarea{
  padding:10px;border-radius:10px;border:1px solid #cbd5f5
}
button{background:#020617;color:#fff;cursor:pointer}
button.secondary{background:#475569}
button.danger{background:#b91c1c}
textarea{width:100%;min-height:160px}
small{color:#64748b}
.product{display:flex;gap:10px;align-items:center}
.product img{
  width:52px;height:52px;border-radius:10px;
  object-fit:cover;background:#eee;flex-shrink:0
}
.shop{font-size:12px;color:#475569}
.link{font-size:12px;color:#2563eb;text-decoration:none}
.center{display:flex;justify-content:center;align-items:center;height:100vh}
.hidden{display:none}
.auth-box{width:360px}
</style>
</head>

<body>

<!-- ================= AUTH ================= -->
<div id="auth" class="center">
  <div class="card auth-box">
    <h2>🔐 Index PRO+ Login</h2>
    <input id="email" placeholder="Email"><br><br>
    <input id="password" type="password" placeholder="Password"><br><br>
    <button onclick="login()">Login</button>
    <button class="secondary" onclick="register()">Register</button>
    <p id="authMsg" style="color:#b91c1c"></p>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">

<header>
  <h1>🚀 Index PRO+ – Feed Opportunity Index</h1>
  <small>SaaS | TikTok Affiliate Intelligence</small>
  <button style="float:right" onclick="logout()">Logout</button>
</header>

<div class="container">

<div class="grid">
  <div class="card"><h3>📦 สินค้าทั้งหมด</h3><div class="stat" id="total">0</div></div>
  <div class="card"><h3>🚀 FOI ≥ 75</h3><div class="stat" id="easy">0</div></div>
  <div class="card"><h3>💰 ROI สูง</h3><div class="stat" id="roiHigh">0</div></div>
  <div class="card"><h3>🔥 หมวดมาแรง</h3><div class="stat" id="topCat">-</div></div>
</div>

<br>

<div class="card">
  <input id="search" placeholder="ค้นหาสินค้า">
  <select id="catFilter"></select>
  <button onclick="apply()">Filter</button>
  <button class="secondary" onclick="exportCSV()">Export CSV</button>
  <button class="danger" onclick="clearFirebase()">🗑 Clear Firebase</button>
</div>

<br>

<div class="card">
<table>
<thead>
<tr>
<th>#</th>
<th>สินค้า</th>
<th>ร้านค้า</th>
<th>หมวด</th>
<th>FOI</th>
<th>ROI</th>
<th>Sell</th>
<th>Feed</th>
<th>สถานะ</th>
</tr>
</thead>
<tbody id="tb"></tbody>
</table>
</div>

<br>

<div class="card">
  <h3>🧠 Send to GPT (No API)</h3>
  <textarea id="gptPrompt"></textarea>
  <button onclick="sendToGPT()">📤 Copy & Open ChatGPT</button>
</div>

</div>
</div>

<script>
/* ================= FIREBASE CONFIG ================= */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT.firebaseio.com",
  projectId: "YOUR_PROJECT",
  appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

/* ================= AUTH ================= */
auth.onAuthStateChanged(user=>{
  auth.style.display = user ? "none" : "flex";
  app.classList.toggle("hidden", !user);
  if(user) load();
});

function login(){
  auth.signInWithEmailAndPassword(email.value,password.value)
    .catch(e=>authMsg.innerText=e.message);
}
function register(){
  auth.createUserWithEmailAndPassword(email.value,password.value)
    .catch(e=>authMsg.innerText=e.message);
}
function logout(){ auth.signOut(); }

/* ================= DATA ================= */
const DB_ROOT=db.ref("imports");
let DATA=[];

/* helpers */
const normalizeShop=v=>{
  if(typeof v!=="string") return "-";
  if(/^\d+$/.test(v)) return "-";
  return v.trim()||"-";
};
function autoCategory(n="",p=0){
  n=n.toLowerCase();
  if(/topper|ท็อปเปอร์/.test(n)) return "Topper";
  if(/ผ้าปู/.test(n)) return "ผ้าปูที่นอน";
  if(/หมอน/.test(n)) return "หมอน";
  if(p>1000) return "Premium Bedding";
  return "Home & Sleep";
}

/* score */
const sellScore=p=>Math.min(p.avgViews/1200,30)+Math.min(p.engagement*4,30);
const feedScore=p=>Math.min(p.avgViews/1000,30)+Math.min(p.engagement*5,25);
const FOI=p=>Math.round(sellScore(p)*0.4+feedScore(p)*0.6);
const roiScore=p=>Math.round(p.foi*0.6+(p.engagement||0)*20);

/* load */
function load(){
  DB_ROOT.once("value",snap=>{
    const map={};
    snap.forEach(b=>{
      b.val()?.items?.forEach(p=>{
        p.shop=normalizeShop(p.shop);
        p.image=p.image||"https://via.placeholder.com/80";
        p.category=autoCategory(p.name,p.price);
        p.sell=sellScore(p);
        p.feed=feedScore(p);
        p.foi=FOI(p);
        p.roi=roiScore(p);
        map[p.name+p.shop]=p;
      });
    });
    DATA=Object.values(map);
    dashboard(); filterCat(); render(DATA); buildGPT();
  });
}

/* UI */
function dashboard(){
  total.innerText=DATA.length;
  easy.innerText=DATA.filter(p=>p.foi>=75).length;
  roiHigh.innerText=DATA.filter(p=>p.roi>=70).length;
  const c={};DATA.forEach(p=>c[p.category]=(c[p.category]||0)+1);
  topCat.innerText=Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||"-";
}
function filterCat(){
  catFilter.innerHTML='<option value="">ทุกหมวด</option>';
  [...new Set(DATA.map(p=>p.category))].forEach(c=>{
    catFilter.innerHTML+=`<option>${c}</option>`;
  });
}
function apply(){
  render(DATA.filter(p=>
    (!search.value||p.name.includes(search.value)) &&
    (!catFilter.value||p.category===catFilter.value)
  ));
}
function render(list){
  tb.innerHTML="";
  list.sort((a,b)=>b.foi-a.foi).forEach((p,i)=>{
    tb.innerHTML+=`
<tr>
<td>#${i+1}</td>
<td><div class="product"><img src="${p.image}"><b>${p.name}</b></div></td>
<td class="shop">${p.shop}</td>
<td><span class="badge">${p.category}</span></td>
<td class="foi">${p.foi}</td>
<td>${p.roi}</td>
<td>${p.sell}</td>
<td>${p.feed}</td>
<td>${p.roi>=70?"💰":"⚠️"}</td>
</tr>`;
  });
}

/* GPT */
function buildGPT(){
  gptPrompt.value="คุณคือผู้เชี่ยวชาญ TikTok Affiliate\n\n"+
  DATA.slice(0,10).map((p,i)=>`${i+1}. ${p.name} (FOI ${p.foi})`).join("\n");
}
function sendToGPT(){
  navigator.clipboard.writeText(gptPrompt.value);
  window.open("https://chat.openai.com","_blank");
}

/* export / clear */
function exportCSV(){
  let csv="name,shop,foi,roi\n";
  DATA.forEach(p=>csv+=`${p.name},${p.shop},${p.foi},${p.roi}\n`);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv]));
  a.download="index_pro.csv";a.click();
}
function clearFirebase(){
  if(confirm("ล้างข้อมูลทั้งหมด?"))
    DB_ROOT.remove().then(()=>location.reload());
}
</script>

</body>
</html>
