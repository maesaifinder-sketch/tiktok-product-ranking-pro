<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Index PRO+ – TikTok Feed Intelligence</title>

<style>
body{margin:0;font-family:system-ui;background:#f1f5f9}
header{background:#020617;color:#fff;padding:20px}
.container{max-width:1500px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.stat{font-size:30px;font-weight:900}
.badge{padding:4px 10px;border-radius:20px;font-size:12px;background:#e5e7eb}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #eee;font-size:14px}
th{background:#f8fafc}
.foi{font-size:18px;font-weight:900}

button,input,select,textarea{
  padding:8px;
  border-radius:8px;
  border:1px solid #cbd5f5;
  font-family:inherit
}
button{background:#020617;color:#fff;cursor:pointer}
button.ghost{background:#fff;color:#020617}
small{color:#64748b}

.pagination{display:flex;gap:6px;flex-wrap:wrap}
.page-btn{
  min-width:34px;padding:6px 10px;border-radius:8px;
  border:1px solid #cbd5f5;background:#fff;cursor:pointer
}
.page-btn.active{background:#020617;color:#fff}

textarea{width:100%;min-height:120px}
a.open{color:#2563eb;text-decoration:none;font-weight:600}
</style>
</head>

<body>

<header>
  <h1>🚀 Index PRO+</h1>
  <small>TikTok Affiliate Intelligence</small>
</header>

<div class="container">

<div class="grid">
  <div class="card"><h3>📦 สินค้าทั้งหมด</h3><div class="stat" id="total">0</div></div>
  <div class="card"><h3>🚀 FOI ≥ 75</h3><div class="stat" id="easy">0</div></div>
  <div class="card"><h3>💰 ROI สูง</h3><div class="stat" id="roiHigh">0</div></div>
  <div class="card"><h3>🔥 หมวดมาแรง</h3><div class="stat" id="topCat">-</div></div>
</div>

<br>

<div class="card">
  <input id="search" placeholder="ค้นหาสินค้า">
  <select id="catFilter"></select>
  <select id="pageSize">
    <option value="20">20 / หน้า</option>
    <option value="50">50 / หน้า</option>
    <option value="100">100 / หน้า</option>
  </select>
  <button onclick="apply()">Filter</button>
  <button class="ghost" onclick="exportCSV()">Export CSV</button>
</div>

<br>

<div class="card">
<table>
<thead>
<tr>
<th><input type="checkbox" onclick="toggleAll(this)"></th>
<th>#</th>
<th>สินค้า</th>
<th>หมวด</th>
<th>FOI</th>
<th>ROI</th>
<th>Link</th>
</tr>
</thead>
<tbody id="tb"></tbody>
</table>

<div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center">
  <div class="pagination" id="pagination"></div>
  <small id="pageInfo"></small>
</div>
</div>

<br>

<div class="card">
  <h3>🤖 Send to GPT</h3>
  <textarea id="gptBox" placeholder="เลือก checkbox เพื่อส่งเฉพาะบางสินค้า"></textarea>
  <button onclick="genGPT()">Generate Prompt</button>
</div>

</div>

<script>
const DB_ROOT="https://index-pro-tiktok-default-rtdb.asia-southeast1.firebasedatabase.app";
const IMPORT_PATH="/imports.json";

let DATA=[],FILTERED=[];
let CURRENT_PAGE=1;
let PAGE_SIZE=20;

/* CATEGORY */
const CATEGORIES=[
  {name:"Topper",regex:/topper|ท็อปเปอร์/i},
  {name:"หมอน",regex:/หมอน/i},
  {name:"ผ้าห่ม",regex:/ผ้าห่ม/i},
  {name:"ผ้าปูที่นอน",regex:/ผ้าปู/i}
];

const detectCategory=name =>
  CATEGORIES.find(c=>c.regex.test(name))?.name || "อื่นๆ";

async function load(){
  const r=await fetch(DB_ROOT+IMPORT_PATH);
  const j=await r.json();

  DATA=[];
  Object.values(j||{}).forEach(b=>{
    (b.items||[]).forEach(p=>{
      p.category=detectCategory(p.name||"");
      p.foi=p.foi||0;
      p.roi=p.roi||0;
      DATA.push(p);
    });
  });

  buildCatFilter();
  apply();
}

function buildCatFilter(){
  const cats=[...new Set(DATA.map(p=>p.category))];
  catFilter.innerHTML='<option value="">ทุกหมวด</option>';
  cats.forEach(c=>{
    const o=document.createElement("option");
    o.value=c;
    o.textContent=c;
    catFilter.appendChild(o);
  });
}

function apply(){
  const q=search.value.toLowerCase();
  const c=catFilter.value;

  FILTERED=DATA.filter(p=>
    (!q || (p.name||"").toLowerCase().includes(q)) &&
    (!c || p.category===c)
  );

  CURRENT_PAGE=1;
  render();
  dashboard();
}

function render(){
  PAGE_SIZE=parseInt(pageSize.value);
  tb.innerHTML="";

  const start=(CURRENT_PAGE-1)*PAGE_SIZE;
  FILTERED.slice(start,start+PAGE_SIZE).forEach((p,i)=>{
    tb.innerHTML+=`
<tr>
<td><input type="checkbox" class="pick" data-i="${start+i}"></td>
<td>${start+i+1}</td>
<td>${p.name||"-"}</td>
<td><span class="badge">${p.category}</span></td>
<td class="foi">${p.foi}</td>
<td>${p.roi}</td>
<td>${p.url?`<a class="open" href="${p.url}" target="_blank">เปิด</a>`:"-"}</td>
</tr>`;
  });

  renderPagination();
}

function renderPagination(){
  pagination.innerHTML="";
  const total=Math.ceil(FILTERED.length/PAGE_SIZE) || 1;

  for(let i=1;i<=total;i++){
    const b=document.createElement("button");
    b.className="page-btn"+(i===CURRENT_PAGE?" active":"");
    b.textContent=i;
    b.onclick=()=>{CURRENT_PAGE=i;render()};
    pagination.appendChild(b);
  }

  pageInfo.textContent=`หน้า ${CURRENT_PAGE} / ${total}`;
}

function dashboard(){
  total.innerText=DATA.length;
  easy.innerText=DATA.filter(p=>p.foi>=75).length;
  roiHigh.innerText=DATA.filter(p=>p.roi>=70).length;
  const c={};
  DATA.forEach(p=>c[p.category]=(c[p.category]||0)+1);
  topCat.innerText=Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||"-";
}

function toggleAll(el){
  document.querySelectorAll(".pick").forEach(c=>c.checked=el.checked);
}

function genGPT(){
  const picks=[...document.querySelectorAll(".pick:checked")]
    .map(c=>FILTERED[c.dataset.i]);
  gptBox.value=picks.map(p=>`- ${p.name}`).join("\n");
}

function exportCSV(){}

pageSize.onchange=()=>apply();
load();
</script>

</body>
</html>
