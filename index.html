<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Index PRO+</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:system-ui;background:#f1f5f9}
header{background:#020617;color:#fff;padding:16px}
.container{max-width:1500px;margin:auto;padding:12px}

.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:10px;border-bottom:1px solid #eee;vertical-align:top}
th{background:#f8fafc;font-size:14px}

.table-wrap{overflow-x:auto}

.product{display:flex;gap:10px;align-items:flex-start}
.product img{
  width:56px;height:56px;
  border-radius:10px;
  object-fit:cover;
  background:#e5e7eb;
  flex-shrink:0
}
.product b{
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
  font-size:14px
}

.badge{padding:4px 10px;border-radius:20px;font-size:12px;background:#e5e7eb}
.foi{font-weight:900;font-size:18px}

@media(max-width:768px){
  th,td{font-size:12px}
}
</style>
</head>

<body>
<header>
  <h2>🚀 Index PRO+</h2>
  <small>TikTok Affiliate Intelligence</small>
</header>

<div class="container">

<div class="card table-wrap">
<table>
<thead>
<tr>
<th>#</th>
<th>สินค้า</th>
<th>ร้าน</th>
<th>หมวด</th>
<th>FOI</th>
<th>ROI</th>
<th>Sell</th>
<th>Feed</th>
<th>สถานะ</th>
</tr>
</thead>
<tbody id="tb"></tbody>
</table>
</div>

</div>

<script>
/* ===== Firebase ===== */
firebase.initializeApp({
  apiKey: "AIzaSyXXXX",
  databaseURL: "https://index-pro-tiktok-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "index-pro-tiktok"
});
const DB_ROOT = firebase.database().ref("imports");

/* ===== Helpers ===== */
const imgFallback="https://via.placeholder.com/80?text=No+Image";

const autoCategory=(n="",p=0)=>{
  n=n.toLowerCase();
  if(n.includes("topper")) return "Topper";
  if(n.includes("ผ้าปู")) return "ผ้าปูที่นอน";
  if(n.includes("หมอน")) return "หมอน";
  if(p>1000) return "Premium Bedding";
  return "Home & Sleep";
};

const sellScore=p=>Math.round(Math.min(p.avgViews/1200,30)+Math.min(p.engagement*4,30));
const feedScore=p=>Math.round(Math.min(p.avgViews/1000,30)+Math.min(p.engagement*5,25));
const FOI=p=>Math.round(sellScore(p)*0.4+feedScore(p)*0.6);
const roiScore=p=>Math.round(p.foi*0.6+(p.engagement||0)*20);

/* ===== Load ===== */
DB_ROOT.once("value",snap=>{
  const list=[];
  snap.forEach(batch=>{
    batch.val()?.items?.forEach(p=>{
      const img = (typeof p.image==="string" && p.image.startsWith("http"))
        ? p.image
        : imgFallback;

      const item={
        ...p,
        image: img,
        shop: p.shop || "-",
        category: autoCategory(p.name,p.price),
      };
      item.sell=sellScore(item);
      item.feed=feedScore(item);
      item.foi=FOI(item);
      item.roi=roiScore(item);

      list.push(item);
    });
  });
  render(list);
});

/* ===== Render ===== */
function render(list){
  tb.innerHTML="";
  list.sort((a,b)=>b.foi-a.foi).forEach((p,i)=>{
    tb.innerHTML+=`
<tr>
<td>${i+1}</td>
<td>
  <div class="product">
    <img src="${p.image}" onerror="this.src='${imgFallback}'">
    <b>${p.name}</b>
  </div>
</td>
<td>${p.shop}</td>
<td><span class="badge">${p.category}</span></td>
<td class="foi">${p.foi}</td>
<td>${p.roi}</td>
<td>${p.sell}</td>
<td>${p.feed}</td>
<td>${p.roi>=70?"💰":"⚠️"}</td>
</tr>`;
  });
}
</script>
</body>
</html>
